<title>선회와류식 터빈 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 왼쪽 3D 뷰(주), 오른쪽 조작·치수 패널 — 좁으면 위아래로 */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --ink:#1d2a33; --muted:#5d6b75; --line:#d5dde2;
  --accent:#1f6f8b; --water:#3a8fb7; --warn:#a4561b;
  --f-ui:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11171b;--panel:#182127;--ink:#e3eaee;--muted:#9aa9b2;--line:#2b3943;--accent:#5fb3cf;--water:#5aa9cf;--warn:#e0a061;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11171b;--panel:#182127;--ink:#e3eaee;--muted:#9aa9b2;--line:#2b3943;--accent:#5fb3cf;--water:#5aa9cf;--warn:#e0a061;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);margin:0}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;height:100%;box-sizing:border-box;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:860px){.wrap{grid-template-columns:1fr;height:auto}#view{height:62vh}}
#view{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:420px;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted)}
.tag{position:absolute;right:12px;top:10px;font-size:12px;color:var(--muted);text-align:right;line-height:1.5}
aside{display:flex;flex-direction:column;gap:14px;min-width:0;overflow:auto}
h1{font-size:19px;margin:0;text-wrap:balance}
.sub{font-size:13px;color:var(--muted);margin:2px 0 0}
fieldset{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:0;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
legend{font-size:12px;letter-spacing:.06em;color:var(--muted);padding:0 4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:5px 9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.seg button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
input[type=range]{width:150px}
table{border-collapse:collapse;width:100%;font-size:13px}
td{padding:3px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);line-height:1.55;margin:0}
.note b{color:var(--warn);font-weight:600}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">

<div class="wrap">
  <div id="view"><div class="tag" id="tag"></div><div class="hint">끌어서 회전 · 휠/두 손가락으로 확대</div></div>
  <aside>
    <div><h1>선회와류식 터빈 3D</h1><p class="sub">상원이엔씨 카탈로그 규격표(p.4) 치수로 그린 형상</p></div>
    <fieldset><legend>형식</legend><div class="seg" id="sizes"></div></fieldset>
    <fieldset><legend>침수깊이 (카탈로그 Detail A)</legend><div class="seg" id="levels"></div>
      <table id="imm"></table></fieldset>
    <fieldset><legend>보기</legend>
      <label class="row" for="cut">반단면 (내부 보기)<input type="checkbox" id="cut"></label>
      <label class="row" for="wat">수면 표시<input type="checkbox" id="wat" checked></label>
      <label class="row" for="wrap">날개 감김각 <span id="wrapv"></span><input type="range" id="wrap" min="30" max="120" step="1" value="92"></label>
    </fieldset>
    <fieldset><legend>규격 (mm)</legend><table id="dims"></table></fieldset>
    <p class="note">날개는 매끈한 곡면(요철 없음), 반시계 회전 기준입니다. <b>날개 감김각과 날개 높이 변화는 카탈로그에 없어 특허 도면 비율로 가정</b>한 값이라 조절할 수 있습니다. 터보프로펠러는 카탈로그에 치수가 없어 넣지 않았습니다.</p>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// 카탈로그 규격표 (mm): A 최대경, B 공칭경, C 허브경, D 흡입구경, E 플랜지 길이, F 채널 높이, G 몸체(흡입구~플랜지판), H 콘 높이(플랜지판~연결 플랜지 상단), J 전체 높이, BC 볼트원, N 날개 수
const CAT={
 900:{A:960,B:900,C:152,D:640,E:170,F:70,G:200,H:325,J:525,BC:125,N:9,kg:70},
 1250:{A:1350,B:1250,C:219,D:832,E:160,F:80,G:295,H:320,J:615,BC:180,N:12,kg:85},
 1600:{A:1660,B:1600,C:244,D:1085,E:310,F:105,G:420,H:495,J:915,BC:200,N:15,kg:150},
 2000:{A:2100,B:2000,C:298,D:1340,E:240,F:180,G:520,H:500,J:1020,BC:250,N:18,kg:310},
 2500:{A:2600,B:2500,C:406,D:1670,E:200,F:220,G:650,H:510,J:1160,BC:320,N:21,kg:620},
 3150:{A:3250,B:3150,C:406,D:2070,E:265,F:225,G:815,H:570,J:1385,BC:320,N:24,kg:960}};
// 침수깊이: 수면 높이(플랜지판 상면 = 0 기준, mm)
const IMM={
 900:[["+1",70],["+0.67",47],["±0",0],["−1",-70]], 1250:[["+1",80],["+0.67",54],["±0",0],["−1",-80]], 1600:[["+1",105],["+0.67",70],["±0",0],["−1",-105]],
 2000:[["+1",180],["+0.67",121],["±0",0],["−0.67",-110],["−1",-180]], 2500:[["+1",220],["+0.67",148],["±0",0],["−0.67",-110],["−1",-220]],
 3150:[["+1",225],["+0.67",150],["±0",0],["−0.67",-150],["−1",-225]]};
const S={size:2500, lv:0, wrap:92, cut:false, wat:true};
try{const s=JSON.parse(localStorage.getItem("turb3d")||"{}"); Object.assign(S,s);}catch(e){}
const save=()=>{try{localStorage.setItem("turb3d",JSON.stringify(S))}catch(e){}};

const view=document.getElementById("view");
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(2,devicePixelRatio)); view.prepend(renderer.domElement);
const scene=new THREE.Scene(); const cam=new THREE.PerspectiveCamera(35,1,0.01,100);
scene.add(new THREE.HemisphereLight(0xffffff,0x5a6670,1.1)); const dl=new THREE.DirectionalLight(0xffffff,1.3); dl.position.set(3,5,4); scene.add(dl);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let group=null;
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.15,side:THREE.DoubleSide,...o});

function lathe(prof,mat,seg){ return new THREE.Mesh(new THREE.LatheGeometry(prof.map(p=>new THREE.Vector2(p[0],p[1])),seg, S.cut?Math.PI:0, S.cut?Math.PI:Math.PI*2),mat); }
function ringSolid(r0,r1,z0,z1,mat){ return lathe([[r0,z0],[r1,z0],[r1,z1],[r0,z1],[r0,z0]],mat,96); }
function build(){
  if(group){scene.remove(group); group.traverse(o=>{o.geometry&&o.geometry.dispose()});}
  group=new THREE.Group(); scene.add(group);
  const c=CAT[S.size], k=c.B/2500; const A=c.A/2e3,B=c.B/2e3,Cr=c.C/2e3,D=c.D/2e3,E=c.E/1e3,F=c.F/1e3,G=c.G/1e3,H=c.H/1e3;
  const tS=0.010+0.004*k, tP=0.012*Math.max(.7,k);
  const body=M(0xc9672f), vane=M(0xd9783c), steel=M(0x3b4247,{metalness:.5,roughness:.4});
  // 몸체(콘): 흡입구 D에서 플랜지판 B로 벌어지는 나팔형 쉘
  const rz=z=>{const t=(z+G)/G; return D+(B-D)*Math.pow(t,2.4)};
  const prof=[]; for(let i=0;i<=24;i++){const z=-G+G*i/24; prof.push([rz(z),z]);}
  const inner=prof.map(([r,z])=>[r-tS,z]).reverse();
  group.add(lathe([...prof,[B,0],[B-tS,0],...inner,[D-tS,-G],[D,-G]],body,96));
  // 플랜지판(테두리): 공칭경 ~ 최대경
  group.add(ringSolid(B-0.06*k,A,-tP,0,body));
  // 날개: 몸체 안쪽 면을 따라 올라와 플랜지판 위로 나가는 매끈한 곡면, 두께 tV, 바깥 끝 높이 F
  const tV=0.008+0.006*k, N=c.N, W=S.wrap*Math.PI/180;
  const z0=-0.6*G, ns=40;
  const path=[]; // [r,z,nr,nz] 자오면 경로와 날개 높이 방향(유로 쪽 법선)
  for(let i=0;i<=ns;i++){const s=i/ns; let r,z,nr,nz;
    if(s<0.55){const u=s/0.55; z=z0+(-z0)*u; r=rz(z)-tS; const dz=1e-3, dr=(rz(z+dz)-rz(z-dz))/(2*dz); const L=Math.hypot(dr,1); nr=-1/L; nz=dr/L;}
    else{const u=(s-0.55)/0.45; z=0; r=(B-tS)+(A-(B-tS))*u; nr=0; nz=1;}
    path.push([r,z,nr,nz,s]);}
  const hgt=s=>F*(0.45+0.55*Math.min(1,s/0.7)); // 안쪽 아래는 낮고 바깥은 채널 높이 F
  const vg=new THREE.BufferGeometry(); const pos=[], idx=[];
  for(let b=0;b<N;b++){ if(S.cut){const a0=2*Math.PI*b/N; const mid=a0-W*0.5; const cx=Math.cos(mid); if(cx>0.05) continue;}
    const base=pos.length/3, th0=2*Math.PI*b/N;
    for(const [r,z,nr,nz,s] of path){ const th=th0-W*s; // 바깥쪽이 회전 반대로 뒤처지는 후향 곡면 (반시계 회전)
      const h=hgt(s);
      for(const side of [-1,1]){ const dth=side*tV/2/Math.max(r,0.05);
        for(const hh of [0,h]){ const rr=r+nr*hh, zz=z+nz*hh, t=th+dth; pos.push(rr*Math.cos(t),zz,-rr*Math.sin(t)); /* y-up, 위에서 보아 반시계 = +t */ } } }
    const n=path.length;
    for(let i=0;i<n-1;i++){ const q=(i,j)=>base+i*4+j; // j: 0 앞-바닥,1 앞-끝,2 뒤-바닥,3 뒤-끝
      for(const [a,bb] of [[0,1],[2,3],[1,3],[0,2]]){ idx.push(q(i,a),q(i+1,a),q(i+1,bb), q(i,a),q(i+1,bb),q(i,bb)); } }
    const q=(i,j)=>base+i*4+j; idx.push(q(n-1,0),q(n-1,1),q(n-1,3), q(n-1,0),q(n-1,3),q(n-1,2), q(0,0),q(0,2),q(0,3), q(0,0),q(0,3),q(0,1));
  }
  vg.setAttribute("position",new THREE.Float32BufferAttribute(pos,3)); vg.setIndex(idx); vg.computeVertexNormals(); group.add(new THREE.Mesh(vg,vane));
  // 상부: 덮개 링(날개 위), 강철 틀(F ~ H−E), 허브(C), 연결 플랜지
  group.add(ringSolid(0.66*A,0.74*A,F,F+tP,steel));   // 날개 상단을 묶는 좁은 링 (특허 도면 223)
  const fr=0.22*c.B/1e3, fh=Math.max(0.03,H-E-F);
  const box=new THREE.Mesh(new THREE.BoxGeometry(2*fr,fh,2*fr),steel); box.position.set(0,F+fh/2,0); if(!S.cut) group.add(box);
  for(let i=0;i<3;i++){const a=2*Math.PI*i/3+0.3; if(S.cut&&Math.cos(a)>0) continue; const L=0.70*A-fr*0.9; const sp=new THREE.Mesh(new THREE.BoxGeometry(L,0.02*k+0.012,0.05*k+0.02),steel); sp.position.set(Math.cos(a)*(fr*0.9+L/2),F+tP,-Math.sin(a)*(fr*0.9+L/2)); sp.rotation.y=a; group.add(sp);}
  group.add(lathe([[0,H-E],[Cr,H-E],[Cr,H-0.03],[c.BC/2e3+0.045,H-0.03],[c.BC/2e3+0.045,H],[0,H]],steel,64));
  // 수면
  const lvl=IMM[S.size][Math.min(S.lv,IMM[S.size].length-1)];
  if(S.wat){ const pl=new THREE.Mesh(new THREE.CircleGeometry(A*1.45,96),new THREE.MeshStandardMaterial({color:new THREE.Color(css("--water")),transparent:true,opacity:.28,side:THREE.DoubleSide,depthWrite:false})); pl.rotation.x=-Math.PI/2; pl.position.y=lvl[1]/1e3; group.add(pl); }
  // 표·라벨
  const tag=document.getElementById("tag"); tag.innerHTML=`Ø${S.size}형 · 날개 ${N}매<br>침수 ${lvl[0]} (수면 = 플랜지판 ${lvl[1]>=0?"+":""}${lvl[1]} mm)`;
  const sub=c.G+lvl[1], ch=Math.max(0,Math.min(c.F,lvl[1]));
  document.getElementById("imm").innerHTML=`<tr><td>흡입구 깊이 (수면 아래)</td><td>${sub} mm</td></tr><tr><td>채널이 물에 잠긴 높이</td><td>${ch} / ${c.F} mm</td></tr><tr><td>연결 플랜지 상단 (수면 위)</td><td>${c.H-lvl[1]} mm</td></tr>`;
  const rows=[["최대경 A",c.A],["공칭경 B",c.B],["허브경 C",c.C],["흡입구경 D",c.D],["플랜지 길이 E",c.E],["채널 높이 F",c.F],["몸체 높이 G",c.G],["콘 높이 H",c.H],["전체 높이 J",c.J],["볼트원",c.BC],["날개 수",c.N+" 매"],["중량",c.kg+" kg"]];
  document.getElementById("dims").innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("");
  fit(c);
}
// 카메라: 구면 좌표 + 드래그 회전
let az=0.8, el=0.22, dist=3;
function fit(c){ dist=c.A/1e3*2.6; place(); }
function place(){ cam.position.set(dist*Math.cos(el)*Math.sin(az), dist*Math.sin(el), dist*Math.cos(el)*Math.cos(az)); cam.lookAt(0,-0.15*dist/2.6,0); }
function size(){ const w=view.clientWidth,h=view.clientHeight; renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); }
new ResizeObserver(size).observe(view);
const pts=new Map(); let pd=0;
renderer.domElement.addEventListener("pointerdown",e=>{renderer.domElement.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]);});
renderer.domElement.addEventListener("pointermove",e=>{ if(!pts.has(e.pointerId)) return; const p=pts.get(e.pointerId);
  if(pts.size===1){ az-=(e.clientX-p[0])*0.008; el=Math.max(-1.2,Math.min(1.4,el+(e.clientY-p[1])*0.008)); }
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); if(pd) dist*=pd/d; pd=d; } place(); });
const up=e=>{pts.delete(e.pointerId); pd=0;}; renderer.domElement.addEventListener("pointerup",up); renderer.domElement.addEventListener("pointercancel",up);
renderer.domElement.addEventListener("wheel",e=>{e.preventDefault(); dist*=Math.exp(e.deltaY*0.001); place();},{passive:false});
(function loop(){ renderer.render(scene,cam); requestAnimationFrame(loop); })();

// 조작부
const sz=document.getElementById("sizes"), lv=document.getElementById("levels");
function seg(el,items,cur,on){ el.innerHTML=""; items.forEach((it,i)=>{const b=document.createElement("button"); b.type="button"; b.textContent=it; b.setAttribute("aria-pressed",String(i===cur)); b.onclick=()=>on(i); el.appendChild(b);}); }
const SIZES=Object.keys(CAT).map(Number);
function ui(){ seg(sz,SIZES.map(s=>"Ø"+s),SIZES.indexOf(S.size),i=>{S.size=SIZES[i]; S.lv=0; ui(); build(); save();});
  seg(lv,IMM[S.size].map(x=>x[0]),Math.min(S.lv,IMM[S.size].length-1),i=>{S.lv=i; ui(); build(); save();});
  document.getElementById("wrapv").textContent=S.wrap+"°"; }
document.getElementById("cut").checked=S.cut; document.getElementById("wat").checked=S.wat; document.getElementById("wrap").value=S.wrap;
document.getElementById("cut").onchange=e=>{S.cut=e.target.checked; build(); save();};
document.getElementById("wat").onchange=e=>{S.wat=e.target.checked; build(); save();};
document.getElementById("wrap").oninput=e=>{S.wrap=+e.target.value; ui(); build(); save();};
ui(); size(); build();
</script>
